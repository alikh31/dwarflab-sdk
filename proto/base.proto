syntax = "proto3";

package dwarflab.base;

option java_package = "com.convergence.dwarflab.proto";
option java_outer_classname = "BaseProto";

message WsPacket {
  uint32 major_version = 1;
  uint32 minor_version = 2;
  uint32 device_id = 3;
  uint32 module_id = 4;
  uint32 cmd = 5;
  uint32 type = 6;
  bytes data = 7;
  string client_id = 8;
}

message ComResponse {
  int32 code = 1;
}

message ComResWithInt {
  int32 value = 1;
  int32 code = 2;
}

message ComResWithDouble {
  double value = 1;
  int32 code = 2;
}

message ComResWithString {
  string str = 1;
  int32 code = 2;
}

message CommonParam {
  bool hasAuto = 1;
  int32 auto_mode = 2;
  int32 id = 3;
  int32 mode_index = 4;
  int32 index = 5;
  double continue_value = 6;
}

enum WsMajorVersion {
  WS_MAJOR_VERSION_UNKNOWN = 0;
  WS_MAJOR_VERSION_NUMBER = 1;
}

enum WsMinorVersion {
  WS_MINOR_VERSION_UNKNOWN = 0;
  WS_MINOR_VERSION_NUMBER = 20;
}
