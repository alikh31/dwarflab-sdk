syntax = "proto3";

package dwarflab.task_center;

import "notify.proto";
import "panorama.proto";
import "astro.proto";

option java_package = "com.convergence.dwarflab.proto";
option java_outer_classname = "TaskCenterProto";

enum ExclusiveTaskType {
  EXCLUSIVE_TYPE_NONE = 0;
  EXCLUSIVE_TYPE_CAMERA = 1;
  EXCLUSIVE_TYPE_MOTOR = 2;
  EXCLUSIVE_TYPE_FOCUS_MOTOR = 4;
  EXCLUSIVE_TYPE_SYSTEM_IO = 8;
  EXCLUSIVE_TYPE_SYSTEM_WIFI = 16;
}

enum TaskId {
  TASK_ID_IDLE = 0;
  TASK_ID_PANORAMA_UPLOAD = 1;
  TASK_ID_ASTRO_MULTI_STACK_THUMBNAIL_GENERATION = 2;
  TASK_ID_ASTRO_MULTI_STACK = 3;
  TASK_ID_CAPTURE_CALI_FRAME = 4;
}

message TaskAttr {
  int32 exclusive_mask = 1;
  int32 priority = 2;
}

message TaskState {
  int32 base_state = 1;
  oneof extended_state {
    int32 astro_extended_state = 2;
  }
}

message TaskParam {
  oneof param {
    dwarflab.panorama.PanoramaUploadParam panorama_upload = 1;
    dwarflab.astro.MakeFitsThumbTaskParam make_fits_thumb_task_param = 2;
    dwarflab.astro.RepostprocessTaskParam repostprocess_task_param = 3;
    dwarflab.astro.CaptureCaliFrameTaskParam capture_cali_frame_task_param = 4;
  }
}

message ResNotifyTaskState {
  int32 task_id = 1;
  TaskAttr task_attr = 2;
  TaskState state = 3;
  TaskParam param = 4;
}

message ReqStartTask {
  int32 task_id = 1;
  oneof param {
    dwarflab.astro.ReqStartMakeFitsThumb req_make_fits_thumb_param = 2;
    dwarflab.astro.ReqStartRepostprocess req_repostprocess_param = 3;
  }
}

message ReqStopTask {
  int32 task_id = 1;
}

message ResTaskCenter {
  int32 code = 1;
  int32 task_id = 2;
}

message ClientParams {
  int32 encode_type = 1;
}

message ReqEnterCamera {
  ClientParams client_param = 3;
}

message ResEnterCamera {
  int32 code = 1;
  int32 shooting_mode_id = 2;
}

message ReqSwitchShootingMode {
  int32 mode = 1;
}

message ResSwitchShootingMode {
  int32 code = 1;
  int32 shooting_mode_id = 2;
}

message ReqSwitchShootingTech {
  int32 tech = 1;
}

message ResSwitchShootingTech {
  int32 code = 1;
  int32 shooting_tech_id = 2;
}

message ReqGetDeviceStateInfo {}

message ExclusiveCameraState {
  oneof current_state {
    dwarflab.notify.CaptureRawState capture_raw_state = 1;
    dwarflab.notify.PhotoState photo_state = 2;
    dwarflab.notify.BurstState burst_state = 3;
    dwarflab.notify.RecordState record_state = 4;
    dwarflab.notify.TimeLapseState timelapse_state = 5;
    dwarflab.notify.CaptureCaliFrameState capture_cali_frame_state = 6;
    dwarflab.notify.PanoramaState panorama_state = 7;
    dwarflab.notify.SentryState sentry_state = 8;
  }
}

message TeleCameraStateInfo {
  ExclusiveCameraState exclusive_state = 1;
  dwarflab.notify.StreamType stream_type = 2;
  double h_fov = 3;
  double v_fov = 4;
  int32 resolution_width = 5;
  int32 resolution_height = 6;
  dwarflab.notify.CmosTemperature cmos_temperature = 7;
}

message WideCameraStateInfo {
  ExclusiveCameraState exclusive_state = 1;
  dwarflab.notify.StreamType stream_type = 2;
  double h_fov = 3;
  double v_fov = 4;
  int32 resolution_width = 5;
  int32 resolution_height = 6;
  dwarflab.notify.CmosTemperature cmos_temperature = 7;
}

message ExclusiveFocusMotorState {
  oneof current_state {
    dwarflab.notify.AstroAutoFocusState astro_auto_focus_state = 1;
    dwarflab.notify.NormalAutoFocusState normal_auto_focus_state = 2;
    dwarflab.notify.AstroAutoFocusFastState astro_auto_focus_fast_state = 3;
    dwarflab.notify.AreaAutoFocusState area_auto_focus_state = 4;
  }
}

message FocusMotorStateInfo {
  ExclusiveFocusMotorState exclusive_state = 1;
  dwarflab.notify.FocusPosition focus_position = 2;
}

message ExclusiveMotionMotorState {
  oneof current_state {
    dwarflab.notify.AstroCalibrationState astro_calibration_state = 1;
    dwarflab.notify.AstroGotoState astro_goto_state = 2;
    dwarflab.notify.AstroTrackingState astro_tracking_state = 3;
    dwarflab.notify.NormalTrackState normal_track_state = 4;
    dwarflab.notify.OneClickGotoState one_click_goto_state = 5;
    dwarflab.notify.EqSolvingState eq_state = 6;
    dwarflab.notify.SentryState sentry_state = 7;
    dwarflab.notify.SkyTargetFinderState sky_target_finder_state = 8;
  }
}

message MotionMotorStateInfo {
  ExclusiveMotionMotorState exclusive_state = 1;
  dwarflab.notify.SentryAutoHand sentry_auto_hand = 2;
}

message DeviceStateInfo {
  dwarflab.notify.RgbState rgb_state = 1;
  dwarflab.notify.PowerIndState power_ind_state = 2;
  dwarflab.notify.ChargingState charging_state = 3;
  dwarflab.notify.StorageInfo storage_info = 4;
  dwarflab.notify.MTPState mtp_state = 5;
  dwarflab.notify.CPUMode cpu_mode = 6;
  dwarflab.notify.Temperature temperature = 7;
  dwarflab.notify.BodyStatus body_status = 8;
  dwarflab.notify.BatteryInfo battery_info = 9;
  dwarflab.notify.CalibrationResult calibration_result = 10;
  dwarflab.notify.PictureMatching picture_matching = 11;
}

message ConnectionStateInfo {
  dwarflab.notify.HostSlaveMode host_slave_mode = 1;
}

message ShootingModeAndTech {
  int32 shooting_mode = 1;
  int32 parent_shooting_mode = 2;
  repeated int32 shooting_techs = 3;
}

message ResGetDeviceStateInfo {
  int32 shooting_mode = 1;
  TeleCameraStateInfo tele_camera_state_info = 2;
  WideCameraStateInfo wide_camera_state_info = 3;
  FocusMotorStateInfo focus_motor_state_info = 4;
  MotionMotorStateInfo motion_motor_state_info = 5;
  DeviceStateInfo device_state_info = 6;
  int32 code = 7;
  ConnectionStateInfo connection_state_info = 8;
  repeated ShootingModeAndTech shooting_mode_and_techs = 9;
}
