syntax = "proto3";

package dwarflab.panorama;

option java_package = "com.convergence.dwarflab.proto";
option java_outer_classname = "PanoramaProto";

message ReqStartPanoramaByGrid {}

message ReqStartPanoramaByEulerRange {
  float yaw_range = 1;
  float pitch_range = 2;
}

message ReqStopPanorama {}

message ReqStartPanoramaStitchUpload {
  int64 resource_id = 1;
  string user_id = 2;
  int32 app_platform = 3;
  string panorama_name = 4;
  string ak = 5;
  string sk = 6;
  string token = 7;
  string bucket = 8;
  string bucket_prefix = 9;
  string from = 10;
  string env_type = 11;
}

message ReqStopPanoramaStitchUpload {
  string user_id = 1;
}

message ReqGetPanoramaCurrentUploadState {}

message ResGetPanoramaCurrentUploadState {
  int32 code = 1;
  string user_id = 2;
  string busi_no = 3;
  string panorama_name = 4;
  string mac = 5;
  int32 total_files_num = 6;
  int32 compressed_files_num = 7;
  int64 total_size = 8;
  int64 uploaded_size = 9;
  int32 step = 10;
}

message ReqGetUploadPredict {
  string panorama_name = 1;
}

message ResGetUploadPredict {
  int32 code = 1;
  string panorama_name = 2;
  int32 file_nums = 3;
  string resolution = 4;
  int64 cloud_data_size = 5;
  int64 zip_data_size = 6;
  int64 app_zip_data_size = 7;
}

message PanoramaUploadParam {
  string user_id = 1;
  string busi_no = 2;
  string panorama_name = 3;
  string mac = 4;
  int32 total_files_num = 5;
  int32 compressed_files_num = 6;
  int64 total_size = 7;
  int64 uploaded_size = 8;
  int32 step = 9;
}

message ReqCompressPanorama {
  string panorama_name = 1;
}

message ReqStopCompressPanorama {}

message ReqStartPanoramaFraming {}

message ReqStopPanoramaFraming {}

message ReqResetPanoramaFraming {}

message ReqUpdatePanoramaFramingRect {
  double norm_x_tl = 1;
  double norm_y_tl = 2;
  double norm_x_br = 3;
  double norm_y_br = 4;
}

message ReqStopPanoramaFramingAndStartGrid {}

message ResStopPanoramaFraming {
  int32 code = 1;
  double centerX_degree_offset = 2;
  double centerY_degree_offset = 3;
  int32 framing_rows = 4;
  int32 framing_cols = 5;
}
