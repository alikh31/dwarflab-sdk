name: Release

# Publishes both packages to npm when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Authentication uses npm Trusted Publishing (OIDC) — there is NO npm token.
# GitHub's OIDC identity for this workflow is exchanged for a short-lived,
# single-use npm publish credential. Provenance attestation is automatic.
#
# One-time setup on npmjs.com (per package, after the first manual publish):
#   Package → Settings → Trusted Publisher → GitHub Actions, with:
#     Organization/user:  alikh31
#     Repository:         dwarflab-sdk
#     Workflow filename:  release.yml
#   See the repo README/CONTRIBUTING for the full walkthrough.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build & publish to npm (Trusted Publishing)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC Trusted Publishing + provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing requires npm >= 11.5.1, which is newer than the npm
      # bundled with Node 20. Upgrade the CLI before publishing.
      - name: Upgrade npm (Trusted Publishing needs npm >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_build_from_source: "false"

      # Re-run the full gate before publishing so a bad tag never ships.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SDK_VER=$(node -p "require('./packages/sdk/package.json').version")
          BLE_VER=$(node -p "require('./packages/ble/package.json').version")
          echo "tag=$TAG sdk=$SDK_VER ble=$BLE_VER"
          if [ "$TAG" != "$SDK_VER" ] || [ "$TAG" != "$BLE_VER" ]; then
            echo "::error::Tag v$TAG does not match package versions (sdk=$SDK_VER, ble=$BLE_VER). Bump versions to match the tag."
            exit 1
          fi

      # Publish the core SDK first; @alikh/dwarflab-ble depends on it.
      # No NODE_AUTH_TOKEN: Trusted Publishing mints the credential via OIDC.
      # Each package's publishConfig sets access:public + provenance:true;
      # --provenance/--access are passed explicitly for clarity.
      - name: Publish @alikh/dwarflab-sdk
        run: npm publish --workspace @alikh/dwarflab-sdk --provenance --access public

      - name: Publish @alikh/dwarflab-ble
        run: npm publish --workspace @alikh/dwarflab-ble --provenance --access public
