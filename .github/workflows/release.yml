name: Release

# Publishes both packages to npm on a version tag (e.g. `git push origin v0.1.0`).
# Auth: npm Trusted Publishing (OIDC) — no token. Setup: see CONTRIBUTING.md.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build & publish to npm (Trusted Publishing)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC Trusted Publishing + provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing needs npm >= 11.5.1 (newer than Node 20's bundled npm).
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_build_from_source: "false"

      # Re-run the full gate before publishing so a bad tag never ships.
      # Build first: the BLE package typechecks/tests against the SDK's dist/.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SDK_VER=$(node -p "require('./packages/sdk/package.json').version")
          BLE_VER=$(node -p "require('./packages/ble/package.json').version")
          echo "tag=$TAG sdk=$SDK_VER ble=$BLE_VER"
          if [ "$TAG" != "$SDK_VER" ] || [ "$TAG" != "$BLE_VER" ]; then
            echo "::error::Tag v$TAG does not match package versions (sdk=$SDK_VER, ble=$BLE_VER). Bump versions to match the tag."
            exit 1
          fi

      # Publish the core SDK first; @alikh/dwarflab-ble depends on it.
      - name: Publish @alikh/dwarflab-sdk
        run: npm publish --workspace @alikh/dwarflab-sdk --provenance --access public

      - name: Publish @alikh/dwarflab-ble
        run: npm publish --workspace @alikh/dwarflab-ble --provenance --access public
