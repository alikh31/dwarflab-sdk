name: Release

# Publishes both packages to npm when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Requires repository secret NPM_TOKEN (an npm *automation* token with
# publish access to the @alikh scope). Provenance is enabled via the
# packages' publishConfig and the id-token permission below.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_build_from_source: "false"

      # Re-run the full gate before publishing so a bad tag never ships.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SDK_VER=$(node -p "require('./packages/sdk/package.json').version")
          BLE_VER=$(node -p "require('./packages/ble/package.json').version")
          echo "tag=$TAG sdk=$SDK_VER ble=$BLE_VER"
          if [ "$TAG" != "$SDK_VER" ] || [ "$TAG" != "$BLE_VER" ]; then
            echo "::error::Tag v$TAG does not match package versions (sdk=$SDK_VER, ble=$BLE_VER). Bump versions to match the tag."
            exit 1
          fi

      # Publish the core SDK first; @alikh/dwarflab-ble depends on it.
      # `npm publish` honors each package's publishConfig (access: public,
      # provenance: true). --provenance is also passed explicitly for clarity.
      - name: Publish @alikh/dwarflab-sdk
        run: npm publish --workspace @alikh/dwarflab-sdk --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @alikh/dwarflab-ble
        run: npm publish --workspace @alikh/dwarflab-ble --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
